[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "retarget"
version = "0.1.0"
description = "A typed, extensible research toolkit for motion retargeting."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=2.4.6",
    "orjson>=3.11.9",
    "rich>=15.0.0",
    "scipy>=1.17.1",
    "urdf",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/retarget"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".venv"]

[tool.mypy]
python_version = "3.12"
packages = ["retarget"]
strict = true
warn_unreachable = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv.workspace]
members = [
    "vendor/urdf",
]

[tool.uv.sources]
urdf = { workspace = true, editable = true }
