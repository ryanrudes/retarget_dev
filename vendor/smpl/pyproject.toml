[project]
name = "smpl"
version = "0.1.0"
description = "Load SMPL-family body models and run forward kinematics."
readme = "README.md"
authors = [
    { name = "Ryan Rudes", email = "ryanrudes@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.4.6",
    "scipy>=1.17.1",
]
keywords = ["smpl", "smplx", "body-model", "kinematics", "typing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/ryanrudes/smpl"
Source = "https://github.com/ryanrudes/smpl"
Issues = "https://github.com/ryanrudes/smpl/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = "src"

[tool.mypy]
python_version = "3.13"
packages = ["smpl"]
strict = true
warn_unreachable = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [".venv"]
